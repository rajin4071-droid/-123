:root{--navy:#123c50;--red:#df493e;--cream:#fffaf0;--line:#dfd1b8}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Arial,'Malgun Gothic',sans-serif;color:#12354b}header{background:#fffdfa;border-bottom:1px solid var(--line);padding:14px max(5%,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;cursor:pointer}.brand small{display:block;font-size:10px;font-weight:400;color:#789}button{cursor:pointer;font:inherit;border:0}.btn{border-radius:9px;padding:12px 17px;background:var(--red);color:white;font-weight:700}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--navy)}main{max-width:1100px;margin:auto;padding:34px 20px 80px}.hero{background:#153f52;border-radius:20px;padding:36px;min-height:300px;display:flex;align-items:center;background-image:radial-gradient(#2b5969 1px,transparent 1px);background-size:20px 20px}.ticket{background:#fff7dd;padding:34px;border-radius:6px;max-width:620px;width:100%;box-shadow:7px 8px #092b3a;transform:rotate(-1deg)}.ticket h1{font-family:Georgia,serif;font-size:clamp(32px,5vw,58px);line-height:1.15;margin:12px 0}.red{color:var(--red)}.center{text-align:center}.eyebrow{font-size:12px;color:var(--red);font-weight:800;letter-spacing:2px}.section-title{font-size:26px;margin:10px 0 26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.hall{background:white;border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:14px;padding:25px;text-align:left;min-height:200px;box-shadow:0 4px #e9dfcd}.hall h2{margin:20px 0 8px}.hall p{font-size:13px;color:#687989}.hall strong{color:var(--accent)}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}.yellow{background:#f4b741;border-radius:15px;padding:24px}.special-link{width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit;transition:transform .15s,box-shadow .15s}.special-link:hover{transform:translateY(-2px);box-shadow:0 5px 15px #123c501c}.special-link:focus-visible{outline:3px solid #0e7795;outline-offset:3px}.whitebox{border:1px solid var(--line);border-radius:15px;background:white;padding:24px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.question{padding:22px;border-radius:12px;background:#fff0ea;border-left:4px solid var(--red);margin:20px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.art{border:1px solid var(--line);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px #e8ddca}.art img{width:100%;height:180px;object-fit:cover}.art-body{padding:15px}.art h3{font-size:17px}.muted{font-size:13px;color:#6a7984}.art-actions{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:12px;margin-top:15px}.link{background:transparent;color:var(--red);font-weight:700}.like{background:#fff4f1;color:#bb453d;padding:7px 10px;border-radius:7px;font-weight:700}.like.active{background:#e84a3e;color:white}.delete{background:#fff0ef;color:#b32d27;padding:7px 11px;border-radius:6px}.overlay{position:fixed;inset:0;background:#071f2ab8;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{background:#fffdf8;border-radius:16px;width:min(100%,600px);max-height:92vh;overflow:auto;padding:28px}.modal h2{margin-top:0}.field{margin:18px 0}.field label{display:block;font-weight:700;margin-bottom:9px}.field input,.field textarea{width:100%;border:1px solid #cfc6b5;border-radius:8px;padding:13px;font:inherit;background:white}.field textarea{min-height:140px;resize:vertical}.preview{width:100%;max-height:240px;object-fit:contain;background:#f3efe5;border-radius:8px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.hidden{display:none!important}.empty{text-align:center;padding:70px 15px;color:#73808a;border:2px dashed var(--line);border-radius:12px}.detail-photo{width:100%;max-height:420px;object-fit:contain;background:#eee;border-radius:10px}.answer{white-space:pre-wrap;line-height:1.7}.pill{font-size:12px;color:var(--red);background:#fff0ec;padding:5px 9px;border-radius:20px}@media(max-width:700px){.grid,.cards,.bottom{grid-template-columns:1fr}.hero{padding:18px}.ticket{padding:24px}.topline{align-items:flex-start;flex-direction:column}header{padding:12px 16px}.modal{padding:20px}}

/* 딸기반 동화책 박물관 테마 */
:root{--navy:#573b36;--red:#ed6172;--cream:#fff9ef;--line:#e8c9ad}
body{background:radial-gradient(circle at 12% 8%,#ffe7ee 0 7%,transparent 21%),radial-gradient(circle at 88% 25%,#e3f4ff 0 7%,transparent 24%),#fff9ef;color:#493c39;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
header{background:#fffdf8ee;border-bottom:3px solid #f4d9bb;box-shadow:0 3px 0 #fff;position:relative;z-index:1}.brand{color:#784735;font-size:18px}.brand small{color:#b77c78}
main{max-width:1160px}.btn{background:#f06b78;border-radius:25px;box-shadow:0 4px 0 #d84b5e;transition:transform .15s}.btn:hover{transform:translateY(-2px)}.btn.secondary{background:#fffdf8;color:#805344;box-shadow:0 3px 0 #e8d2bb}
.hero{background:linear-gradient(145deg,#bde8ff 0%,#e5f7ff 46%,#fff1ce 100%);border:6px solid white;outline:3px solid #efcda9;border-radius:35px;box-shadow:0 12px 0 #e7d2b7,0 20px 30px #ae94722a;position:relative;overflow:hidden;min-height:370px;background-image:radial-gradient(circle at 14% 18%,#fff 0 22px,transparent 24px),radial-gradient(circle at 20% 18%,#fff 0 29px,transparent 31px),radial-gradient(circle at 74% 14%,#fff 0 25px,transparent 27px),linear-gradient(145deg,#bde8ff,#fff1ce)}
.hero:before{content:'✨  ⏰  🚂  📻  🪁  ✨';position:absolute;top:10px;left:0;width:100%;text-align:center;letter-spacing:25px;font-size:21px;opacity:.6;pointer-events:none}
.hero .ticket{background:linear-gradient(#fff0c5,#ffe6b1);border:6px solid #b97849;border-radius:36px;box-shadow:5px 7px 0 #81543b,0 10px 20px #7b593844;transform:rotate(-2deg);text-align:center;position:relative;z-index:1}
.ticket h1{font-family:'Malgun Gothic',sans-serif;color:#75472f;font-weight:900;letter-spacing:-2px;text-shadow:2px 3px #fff9e5}.ticket .red{color:#f05472}.ticket p{font-weight:700;color:#775f4c;line-height:1.7}.ticket hr{border:0;border-top:2px dashed #e3b87d}.ticket .eyebrow{color:#c26a52}.strawberry{display:inline-block;padding:8px 20px;background:#fffaf0;border-radius:40px;color:#d24e66;font-weight:900;box-shadow:0 3px #e6cda6}

.center .eyebrow{color:#df6480}.section-title{color:#724b40}.cute-doors{gap:22px;margin-top:12px}.hall{position:relative;border:5px solid #fff;border-bottom:12px solid var(--accent);border-top:10px solid var(--accent);border-radius:95px 95px 22px 22px;min-height:270px;text-align:center;padding:27px 16px 18px;background:linear-gradient(#fffdf9,#fff1df);box-shadow:0 8px 0 #e8d6bf,0 13px 15px #b6a18a33;transition:transform .2s}.hall:hover{transform:translateY(-7px)}.hall h2{font-size:29px;color:var(--accent);margin:12px 0}.hall p{font-size:14px;color:#876a5b;min-height:34px}.hall strong{display:inline-block;border-radius:30px;background:var(--accent);color:white;padding:10px 19px}.hall hr{border:0}.hall-icon{display:block;font-size:62px;filter:drop-shadow(0 4px #ffffff)}
.yellow{background:#ffe29b;border:4px solid white;box-shadow:0 5px #e8c78b;border-radius:26px}.yellow h2{color:#8d5835}.whitebox{background:#fffdf8;border:3px solid #f1d8c4;border-radius:25px}.special-link{background:#ffe6eb;border:4px solid white;box-shadow:0 5px #e9b7c5}.special-link h3{font-size:23px;color:#bd4865}
.question{background:#fff0e9;border-left:6px solid #ed6172;border-radius:18px}.art{border:4px solid white;border-radius:22px;box-shadow:0 5px 0 #e6cfb5,0 8px 20px #d2b69b55}.art img{height:205px}.pill{background:#ffe7ed;color:#bb4c6c}.like{border-radius:25px}.modal{border:6px solid #fff;border-radius:28px;box-shadow:0 12px 0 #cba88e;background:#fffaf3}.field input,.field textarea{border:2px solid #e8d2b9;border-radius:14px}.field textarea:focus,.field input:focus{outline:3px solid #ffe1a3}.empty{background:#fffdf8;border-radius:22px}

.hero{justify-content:center}.hero .ticket{flex:0 1 720px;max-width:720px}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script></head><body><header><div class="brand" onclick="home()">◉ 시간여행 박물관<small>딸기반 디지털 전시</small></div><nav><button class="btn secondary" onclick="home()">박물관 입구</button> <button class="btn" onclick="openForm()">＋ 전시물 등록</button></nav></header><div id="connection" style="text-align:center;padding:7px;background:#fff2d8;font-size:13px">⏳ 온라인 연결 중...</div><main id="app"></main><div id="overlay" class="overlay hidden"><div class="modal" id="modal"></div></div><script>
const halls=[{name:'교통관',q:'사람과 물건은 어떻게 이동했을까요?',color:'#e84a3e',icon:'🚂'},{name:'통신관',q:'소식은 어떻게 멀리 전해졌을까요?',color:'#0e7795',icon:'📡'},{name:'놀이관',q:'아이들은 무엇을 하며 놀았을까요?',color:'#8052b0',icon:'🎮'}];let hall=-1,step=1,draft={},detailId=null;const key='unused';let exhibits=[];let db=null, userId=null;const bucket='museum-photos';function save(){return true}function ready(){if(!db){alert('온라인 연결 설정이 필요합니다. config.js를 확인해 주세요.');return false}return true}async function initOnline(){if(!window.MUSEUM_CONFIG||!MUSEUM_CONFIG.url||!MUSEUM_CONFIG.anonKey){document.getElementById('connection').textContent='⚠️ 온라인 설정 전: config.js를 입력해 주세요.';return}try{db=window.supabase.createClient(MUSEUM_CONFIG.url,MUSEUM_CONFIG.anonKey);let {data:{session}}=await db.auth.getSession();if(!session){let r=await db.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}userId=session.user.id;await refresh();db.channel('museum-updates').on('postgres_changes',{event:'*',schema:'public',table:'exhibits'},()=>refresh()).on('postgres_changes',{event:'*',schema:'public',table:'likes'},()=>refresh()).subscribe();document.getElementById('connection').textContent='🟢 온라인 공유 연결됨'}catch(e){document.getElementById('connection').textContent='🔴 연결 오류: '+e.message;console.error(e)}}async function refresh(){if(!db)return;let {data,error}=await db.from('exhibits').select('id,hall,name,learning,answer,photo_url,owner_id,created_at,likes(count)').order('created_at',{ascending:false});if(error){document.getElementById('connection').textContent='🔴 불러오기 오류: '+error.message;return}let {data:mine}=await db.from('likes').select('exhibit_id').eq('user_id',userId);likedIds=(mine||[]).map(x=>x.exhibit_id);exhibits=(data||[]).map(x=>({...x,photo:x.photo_url,likes:x.likes?.[0]?.count||0}));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function home(){hall=-1;render()}function goHall(i){hall=i;render()}function goSpecial(){hall=-2;render()}function render(){let a=document.getElementById('app');if(hall===-1){a.innerHTML=`<section class="hero"><div class="ticket"><div class="strawberry">🍓 시간여행 탐험대</div><div class="eyebrow">3학년 사회 × 국어 프로젝트</div><h1>딸기반<br><span class="red">시간여행</span> 박물관</h1><p>교통·통신·놀이를 따라 옛날과 오늘날을 비교하고,<br>달라진 것과 이어지는 것을 발견해요.</p><hr><small>관람권　　　　　　　　　 TIME PASS</small></div></section><div class="center" style="margin:46px 0 24px"><div class="eyebrow">상설 전시</div><h2 class="section-title">어느 전시관으로 떠날까요?</h2></div><div class="grid cute-doors">${halls.map((h,i)=>`<button class="hall" style="--accent:${h.color}" onclick="goHall(${i})"><span class="hall-icon">${h.icon}</span><h2>${h.name}</h2><p>${h.q}</p><hr><strong>전시 관람하기 →</strong></button>`).join('')}</div><div class="bottom"><div class="yellow"><small>핵심 탐구관</small><h2>달라진 것,<br>이어지는 것</h2>시간이 흘러도 그대로인 생활 모습을 찾아봐요.</div><button class="whitebox special-link" onclick="goSpecial()"><h3>🍓 딸기반 특별전 →</h3>친구들의 모든 작품을 한곳에서 살펴보고 생각을 나눠요.<p class="muted">전시된 작품 ${exhibits.length}개 · 전체 작품 보기</p></button></div>`}else if(hall===-2){a.innerHTML=`<div class="topline"><button class="btn secondary" onclick="home()">← 박물관 입구</button><div class="center"><div class="eyebrow">딸기반 특별전</div><h1>🍓 우리들의 모든 전시물</h1><p class="muted">교통관 · 통신관 · 놀이관의 작품 ${exhibits.length}개</p></div><button class="btn" onclick="openForm()">＋ 내 전시물 등록</button></div><hr><div class="question"><strong>친구들의 작품을 감상하고 하트로 공감을 표현해 보세요!</strong></div>${exhibits.length?`<div class="cards">${exhibits.map(x=>artCard(x)).join('')}</div>`:'<div class="empty">아직 등록된 전시물이 없어요.<br>첫 번째 작품을 전시해 보세요!</div>'}`
}else{let h=halls[hall],items=exhibits.filter(x=>x.hall===hall);a.innerHTML=`<div class="topline"><button class="btn secondary" onclick="home()">← 박물관 입구</button><div class="center"><div class="eyebrow">상설 전시 · 0${hall+1}</div><h1>${h.name}</h1></div><button class="btn" onclick="openForm()">＋ 내 전시물 등록</button></div><hr><div class="question"><small class="red">탐구 질문</small><h3>${h.q}</h3></div>${items.length?`<div class="cards">${items.map(x=>artCard(x)).join('')}</div>`:'<div class="empty">아직 전시물이 없어요.<br>첫 번째 큐레이터가 되어 작품을 등록해 보세요!</div>'}`}}function artCard(x){let h=halls[x.hall];return `<article class="art"><img src="${x.photo}" alt="${esc(x.name)} 학생의 작품"><div class="art-body"><span class="pill">${h.name}</span><p class="muted">${esc(x.name)} 큐레이터</p><h3>${esc(x.learning)}</h3><p class="muted">${esc(x.answer).slice(0,75)}${x.answer.length>75?'…':''}</p><div class="art-actions"><button class="like ${liked(x.id)?'active':''}" onclick="toggleLike('${x.id}')">${liked(x.id)?'♥':'♡'} 공감 ${x.likes||0}</button><button class="link" onclick="showDetail('${x.id}')">상세보기 ›</button></div></div></article>`}function closeModal(){document.getElementById('overlay').classList.add('hidden')}function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.remove('hidden')}function openForm(){draft={name:'',learning:'',photo:'',answer:'',hall:hall<0?0:hall};step=1;form()}function form(){if(step===1){modal(`<h2>🎨 나의 전시물 소개하기</h2><p class="muted">1 / 2 단계</p><div class="field"><label>전시관 선택</label><select id="hallSelect" style="padding:12px;width:100%;border-radius:8px">${halls.map((h,i)=>`<option value="${i}" ${draft.hall===i?'selected':''}>${h.name}</option>`).join('')}</select></div><div class="field"><label>이름</label><input id="name" maxlength="30" placeholder="이름을 입력하세요" value="${esc(draft.name)}"></div><div class="field"><label>오늘의 배움 문제</label><input id="learning" maxlength="150" placeholder="오늘의 배움 문제를 적어 보세요" value="${esc(draft.learning)}"></div><div class="field"><label>작품 사진 올리기</label><input id="photo" type="file" accept="image/*"></div>${draft.photo?`<img class="preview" src="${draft.photo}" alt="작품 미리보기">`:''}<div class="actions"><button class="btn secondary" onclick="closeModal()">취소</button><button class="btn" onclick="nextStep()">다음 →</button></div>`)}else{modal(`<h2>🔎 시간여행에서 발견한 변화</h2><p class="muted">2 / 2 단계</p><div class="question"><strong>${["교통수단의 변화로 사람들의 생활모습은 어떻게 달라졌나요?","통신수단의 변화로 사람들의 의사소통 방식이 어떻게 달라졌나요?","옛날과 오늘날의 놀이 문화는 어떻게 다르나요?"][draft.hall]}</strong></div><p class="muted" style="background:#fff6d9;padding:12px;border-radius:9px;margin:12px 0"><strong>💡 글쓰기 힌트</strong><br>${["교통수단이 발달하면서 사람들은 더 ... 하게 이동할 수 있게 되었다.","통신수단이 발달하면서 우리는 소식을 더 ... 하게 되었다.","옛날에는 주로 ... 놀이를 했지만 오늘날에는 ... 놀이를 한다."][draft.hall]}</p><div class="field"><textarea id="answer" aria-label="질문에 대한 답변 작성">${esc(draft.answer)}</textarea></div><div class="actions"><button class="btn secondary" onclick="backStep()">← 이전</button><button class="btn" onclick="publish()">전시 시작하기 ✨</button></div>`)}}async function nextStep(){let name=document.getElementById('name').value.trim(),learning=document.getElementById('learning').value.trim(),h=Number(document.getElementById('hallSelect').value),file=document.getElementById('photo').files[0];if(!name||!learning){alert('이름과 오늘의 배움 문제를 입력해 주세요.');return}draft.name=name;draft.learning=learning;draft.hall=h;if(file){if(!file.type.startsWith('image/')){alert('사진 파일을 선택해 주세요.');return}draft.photo=await compress(file)}if(!draft.photo){alert('작품 사진을 올려 주세요.');return}step=2;form()}function compress(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.72))};img.onerror=()=>{URL.revokeObjectURL(url);alert('사진을 읽지 못했어요.');reject(Error('image'))};img.src=url})}function backStep(){draft.answer=document.getElementById('answer').value;step=1;form()}async function publish(){if(!ready())return;let answer=document.getElementById('answer').value.trim();if(!answer){alert('달라진 점을 작성해 주세요.');return}draft.answer=answer;const btn=document.querySelector('#modal .actions .btn:last-child');btn.disabled=true;btn.textContent='등록 중...';try{const blob=await (await fetch(draft.photo)).blob();const path=userId+'/'+crypto.randomUUID()+'.jpg';const uploaded=await db.storage.from(bucket).upload(path,blob,{contentType:'image/jpeg'});if(uploaded.error)throw uploaded.error;const {data:{publicUrl}}=db.storage.from(bucket).getPublicUrl(path);const {error}=await db.from('exhibits').insert({hall:draft.hall,name:draft.name,learning:draft.learning,answer:draft.answer,photo_url:publicUrl,photo_path:path,owner_id:userId});if(error){await db.storage.from(bucket).remove([path]);throw error}closeModal();hall=draft.hall;await refresh();alert('모든 친구에게 전시물이 공유되었어요! 🎉')}catch(e){alert('전시 등록 실패: '+e.message);btn.disabled=false;btn.textContent='전시 시작하기 ✨'}}let likedIds=[];function liked(id){return likedIds.includes(id)}async function toggleLike(id){if(!ready())return;const was=liked(id);const r=was?await db.from('likes').delete().eq('exhibit_id',id).eq('user_id',userId):await db.from('likes').insert({exhibit_id:id,user_id:userId});if(r.error){alert('공감 저장 실패: '+r.error.message);return}await refresh();if(!document.getElementById('overlay').classList.contains('hidden'))showDetail(id)}async function removeItem(id){if(!ready())return;let x=exhibits.find(e=>e.id===id);if(!x)return;if(x.owner_id!==userId){alert('본인이 등록한 작품만 삭제할 수 있어요. 교사는 Supabase 대시보드에서 다른 작품을 관리할 수 있습니다.');return}if(!confirm(`${x.name} 큐레이터의 전시물을 삭제할까요?\n삭제하면 되돌릴 수 없어요.`))return;const r=await db.from('exhibits').delete().eq('id',id);if(r.error){alert('삭제 실패: '+r.error.message);return}closeModal();await refresh()}function showDetail(id){let x=exhibits.find(e=>e.id===id);if(!x)return;modal(`<span class="pill">${halls[x.hall].name}</span><h2>${esc(x.learning)}</h2><p class="muted">${esc(x.name)} 큐레이터</p><img class="detail-photo" src="${x.photo}" alt="학생 작품"><h3>시간여행에서 발견한 변화</h3><p class="answer">${esc(x.answer)}</p><button class="like ${liked(x.id)?'active':''}" onclick="toggleLike('${x.id}')">${liked(x.id)?'♥ 공감했어요':'♡ 공감하기'} · ${x.likes||0}</button><div class="actions">${x.owner_id===userId?`<button class="delete" onclick="removeItem('${x.id}')">내 전시물 삭제</button>`:""}<button class="btn secondary" onclick="closeModal()">닫기</button></div>`)}document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});render();initOnline();
</script></body></html>
